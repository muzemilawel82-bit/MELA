<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELA (መላ) · Ethiopian Grade 12 AI Educational Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #0a0f0d;
    --bg-surface: #111a16;
    --bg-surface-elevated: #16241e;
    --bg-surface-card: #182821;
    --border: #223b30;
    --border-light: #2d4f40;
    
    --primary: #10b981;
    --primary-hover: #059669;
    --primary-dim: rgba(16, 185, 129, 0.12);
    --primary-glow: rgba(16, 185, 129, 0.25);
    
    --gold: #f59e0b;
    --gold-dim: rgba(245, 158, 11, 0.12);
    --gold-hover: #d97706;
    
    --danger: #ef4444;
    --danger-dim: rgba(239, 68, 68, 0.12);
    --info: #38bdf8;
    --info-dim: rgba(56, 189, 248, 0.12);
    --purple: #a855f7;
    --purple-dim: rgba(168, 85, 247, 0.12);
    
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-dim: #64748b;
    --text-gold: #fbbf24;
    
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --radius-xl: 24px;
    --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', 'Noto Sans Ethiopic', Nyala, system-ui, -apple-system, sans-serif;
    background-color: var(--bg-base);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.5;
    overflow-x: hidden;
  }

  button, input, select, textarea {
    font-family: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    border: none;
    outline: none;
    transition: all 0.2s ease;
  }

  /* Main Shell Layout */
  .app-layout {
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar Navigation */
  .sidebar {
    width: 270px;
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 100;
  }

  .brand-container {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 10px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .brand-logo {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--gold));
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    color: #052014;
    box-shadow: 0 4px 14px var(--primary-glow);
  }

  .brand-text h1 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .brand-text h1 span.am {
    font-family: 'Noto Sans Ethiopic', Nyala, sans-serif;
    color: var(--gold);
    font-size: 15px;
    font-weight: 600;
  }

  .brand-text p {
    font-size: 11px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .nav-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow-y: auto;
  }

  .nav-group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    padding: 12px 12px 6px;
    font-weight: 700;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    position: relative;
  }

  .nav-item svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
    flex-shrink: 0;
  }

  .nav-item:hover {
    background: var(--bg-surface-elevated);
    color: var(--text-primary);
  }

  .nav-item.active {
    background: var(--primary-dim);
    color: var(--primary);
    border: 1px solid rgba(16, 185, 129, 0.25);
  }

  .nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 25%;
    bottom: 25%;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--primary);
  }

  .badge-pill {
    margin-left: auto;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--primary);
    color: #042516;
    font-weight: 700;
  }

  .badge-pill.gold {
    background: var(--gold);
    color: #2b1800;
  }

  .sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .user-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    background: var(--bg-surface-elevated);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
  }

  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: white;
  }

  .user-info {
    flex: 1;
    overflow: hidden;
  }

  .user-name {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  .user-stream {
    font-size: 11px;
    color: var(--gold);
    font-weight: 500;
  }

  /* Main Content Area */
  .main-content {
    flex: 1;
    min-width: 0;
    padding: 28px 36px 64px;
    max-width: 1360px;
    margin: 0 auto;
  }

  /* Top Bar */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
    gap: 20px;
    flex-wrap: wrap;
  }

  .page-title-group h2 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-title-group p {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Segmented Stream Control */
  .stream-toggle {
    display: inline-flex;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    padding: 3px;
    border-radius: var(--radius-md);
  }

  .stream-btn {
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 9px;
    background: transparent;
    color: var(--text-secondary);
  }

  .stream-btn.active {
    background: var(--primary);
    color: #042516;
    font-weight: 700;
    box-shadow: 0 2px 8px var(--primary-glow);
  }

  /* Buttons & Controls */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: var(--primary);
    color: #042516;
    box-shadow: 0 4px 14px var(--primary-glow);
  }

  .btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  .btn-outline {
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-primary);
  }

  .btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .btn-gold {
    background: var(--gold);
    color: #261601;
    font-weight: 700;
  }

  .btn-gold:hover {
    background: var(--gold-hover);
  }

  /* Card and Panel Styles */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-card);
    transition: border-color 0.2s ease;
  }

  .card:hover {
    border-color: var(--border-light);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Search & Filter Bar */
  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 260px;
  }

  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--text-dim);
  }

  .search-input {
    width: 100%;
    padding: 10px 14px 10px 42px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--text-primary);
    font-size: 13.5px;
  }

  .search-input:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px var(--primary-dim);
  }

  .chip-group {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .filter-chip {
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .filter-chip:hover {
    background: var(--bg-surface-elevated);
    color: var(--text-primary);
  }

  .filter-chip.active {
    background: var(--primary-dim);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* -------------------------------------------------------------
     MODULE 1: DIGITAL LIBRARY
  ------------------------------------------------------------- */
  .library-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .book-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.25s ease;
  }

  .book-card:hover {
    transform: translateY(-4px);
    border-color: var(--primary);
    box-shadow: var(--shadow-glow);
  }

  .book-cover {
    height: 160px;
    background: linear-gradient(135deg, #132b20, #0c1a14);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .book-cover-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    color: var(--gold);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .book-icon-wrapper {
    width: 64px;
    height: 64px;
    border-radius: var(--radius-md);
    background: var(--primary-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
  }

  .book-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .book-meta {
    font-size: 11.5px;
    color: var(--text-secondary);
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }

  .book-meta span.subject-pill {
    color: var(--primary);
    background: var(--primary-dim);
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }

  .book-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .book-title-am {
    font-size: 13px;
    color: var(--gold);
    font-family: 'Noto Sans Ethiopic', Nyala, sans-serif;
    margin-bottom: 8px;
  }

  .book-desc {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-bottom: 16px;
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .book-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
  }

  .book-actions .btn {
    flex: 1;
    justify-content: center;
    font-size: 12px;
    padding: 7px 10px;
  }

  /* -------------------------------------------------------------
     MODULE 2: VIDEO LEARNING
  ------------------------------------------------------------- */
  .video-layout {
    display: grid;
    grid-template-columns: 1.8fr 1fr;
    gap: 24px;
  }

  .player-container {
    background: #000;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    aspect-ratio: 16 / 9;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: var(--shadow-card);
  }

  .player-screen {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #153225 0%, #06100b 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    position: relative;
  }

  .play-trigger {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--primary);
    color: #042516;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 0 30px var(--primary-glow);
  }

  .play-trigger:hover {
    transform: scale(1.08);
  }

  .player-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .player-scrub {
    flex: 1;
    height: 4px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    cursor: pointer;
    position: relative;
  }

  .player-scrub-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 38%;
    background: var(--primary);
    border-radius: 2px;
  }

  .playlist-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    height: 520px;
  }

  .playlist-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  .playlist-items {
    overflow-y: auto;
    flex: 1;
    padding: 10px;
  }

  .playlist-item {
    display: flex;
    gap: 12px;
    padding: 12px;
    border-radius: var(--radius-md);
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    width: 100%;
    text-align: left;
    margin-bottom: 6px;
    transition: all 0.2s ease;
  }

  .playlist-item:hover {
    background: var(--bg-surface-elevated);
  }

  .playlist-item.active {
    background: var(--primary-dim);
    border-color: rgba(16, 185, 129, 0.3);
  }

  .playlist-thumb {
    width: 60px;
    height: 44px;
    border-radius: 6px;
    background: var(--bg-surface-card);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    flex-shrink: 0;
    position: relative;
  }

  .playlist-item.active .playlist-thumb {
    background: var(--primary);
    color: #042516;
  }

  .playlist-item-info h4 {
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 2px;
    line-height: 1.3;
  }

  .playlist-item-info span {
    font-size: 11.5px;
    color: var(--text-secondary);
  }

  /* -------------------------------------------------------------
     MODULE 3: MELA AI ASSISTANT
  ------------------------------------------------------------- */
  .ai-assistant-container {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    height: calc(100vh - 170px);
  }

  .ai-sidebar {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .ai-preset-btn {
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.2s ease;
  }

  .ai-preset-btn:hover {
    border-color: var(--primary);
    background: var(--primary-dim);
  }

  .ai-preset-btn small {
    color: var(--gold);
    font-family: 'Noto Sans Ethiopic', Nyala, sans-serif;
    font-size: 11.5px;
  }

  .chat-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-surface-elevated);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg-row {
    display: flex;
    gap: 12px;
    max-width: 85%;
  }

  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-row.bot {
    align-self: flex-start;
  }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 13px;
  }

  .msg-row.bot .msg-avatar {
    background: linear-gradient(135deg, var(--primary), #3b82f6);
    color: #042516;
  }

  .msg-row.user .msg-avatar {
    background: var(--gold);
    color: #2b1800;
  }

  .msg-bubble {
    padding: 14px 18px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.5;
  }

  .msg-row.bot .msg-bubble {
    background: var(--bg-surface-card);
    border: 1px solid var(--border);
    color: var(--text-primary);
  }

  .msg-row.user .msg-bubble {
    background: var(--primary);
    color: #042516;
    font-weight: 600;
  }

  .step-box {
    background: rgba(0, 0, 0, 0.25);
    border-left: 3px solid var(--primary);
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  .step-box h5 {
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .chat-input-bar {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface-elevated);
    display: flex;
    gap: 12px;
  }

  .chat-input {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    color: var(--text-primary);
    font-size: 14px;
  }

  .chat-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-dim);
  }

  /* -------------------------------------------------------------
     MODULE 4: NATIONAL EXAM PREPARATION (EUEE ENGINE)
  ------------------------------------------------------------- */
  .exam-setup-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .exam-package-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: all 0.2s ease;
  }

  .exam-package-card:hover {
    border-color: var(--gold);
    box-shadow: 0 8px 25px rgba(245, 158, 11, 0.12);
  }

  .exam-package-badge {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--gold-dim);
    color: var(--gold);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .exam-package-title {
    font-size: 18px;
    font-weight: 700;
  }

  .exam-package-meta {
    display: flex;
    gap: 14px;
    color: var(--text-secondary);
    font-size: 12.5px;

    grid-template-columns: 1fr 300px;
    gap: 24px;

    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
  }

  .exam-question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }

  .exam-stem {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 24px;
    color: var(--text-primary);
  }

  .choices-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .choice-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: var(--radius-md);
    background: var(--bg-surface-elevated);
    border: 1.5px solid var(--border);
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: all 0.15s ease;
  }

  .choice-item:hover {
    border-color: var(--primary);
    background: var(--primary-dim);
  }

  .choice-item.selected {
    border-color: var(--primary);
    background: var(--primary-dim);
    box-shadow: 0 0 14px var(--primary-dim);
  }

  .choice-letter {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .choice-item.selected .choice-letter {
    background: var(--primary);
    color: #042516;
    border-color: var(--primary);
  }

  .choice-text {
    font-size: 14.5px;
    flex: 1;
  }

  .exam-sidebar-nav {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .exam-timer-box {
    text-align: center;
    padding: 16px;
    border-radius: var(--radius-md);
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
  }

  .timer-display {
    font-size: 32px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--primary);
    letter-spacing: 0.05em;
  }

  .timer-display.urgent {
    color: var(--danger);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .question-palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .palette-node {
    height: 38px;
    border-radius: var(--radius-sm);
    background: var(--bg-surface-elevated);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
  }

  .palette-node.current {
    border-color: var(--gold);
    color: var(--gold);
  }

  .palette-node.answered {
    background: var(--primary-dim);
    border-color: var(--primary);
    color: var(--primary);
  }

     MODULE 5: PERFORMANCE DASHBOARD
  ------------------------------------------------------------- */
  .dashboard-metrics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .metric-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    display: flex;
    flex-direction: column;
  }

  .metric-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .metric-value {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-primary);
  }

  .metric-sub {
    font-size: 11.5px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .dashboard-layout-grid {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }

  .chart-container {
    height: 220px;
    width: 100%;
    margin-top: 16px;
  }

  .subject-progress-row {
    display: grid;
    grid-template-columns: 140px 1fr 50px;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .progress-track {
    height: 8px;
    background: var(--bg-surface-elevated);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 4px;
  }

  .progress-bar-fill.strong { background: var(--primary); }
  .progress-bar-fill.mid { background: var(--gold); }
  .progress-bar-fill.weak { background: var(--danger); }

    background: var(--danger-dim);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  ------------------------------------------------------------- */
  .dictionary-split {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
  }

  .word-list {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    height: 640px;
    overflow-y: auto;
    padding: 10px;

  .word-card-btn {

    text-align: left;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    background: transparent;
    border: 1px solid transparent;
    margin-bottom: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .word-card-btn:hover {
    background: var(--bg-surface-elevated);
  }

  .word-card-btn.active {
    background: var(--primary-dim);
    border-color: rgba(16, 185, 129, 0.3);
  }

  .word-card-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .word-english {
    font-size: 14.5px;
    font-weight: 700;
  }

  .word-amharic {
    font-size: 13px;
    color: var(--gold);
    font-family: 'Noto Sans Ethiopic', Nyala, sans-serif;
  }

  .word-detail-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px;
  }

  .word-detail-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }

  .word-detail-title {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-primary);
  }

  .word-detail-amharic {

    color: var(--gold);
    font-family: 'Noto Sans Ethiopic', Nyala, sans-serif;

  .phonetic-badge {

    align-items: center;
    gap: 6px;

    background: var(--info-dim);

  .modal-overlay {

function renderActiveExamArena() {

  if (appState.examFinished) {
    return renderExamReview();
  }

  const minutes = Math.floor(appState.examSecondsRemaining / 60);
  const seconds = appState.examSecondsRemaining % 60;
  const timeFormatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
  const isUrgent = appState.examSecondsRemaining < 120;

  return `
    <header class="top-header" style="margin-bottom:16px;">
      <div>
        <div style="font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--gold); font-weight:700;">Active National Examination</div>
        <h2 style="font-size:22px;">${exam.title}</h2>
      </div>
      <button type="button" class="btn btn-outline" style="border-color:var(--danger); color:var(--danger);" onclick="confirmSubmitExam()">

    </header>

    <div class="exam-arena">
      <!-- Main Question Stage -->
      <div class="exam-stage">
        <div class="exam-question-header">
          <div>
            <span class="badge-pill" style="margin-left:0;">${q.subject}</span>
            <span style="font-size:12px; color:var(--text-dim); margin-left:8px;">${q.topic}</span>
          </div>
          <span style="font-size:14px; font-weight:700; color:var(--text-secondary);">Question ${appState.currentQuestionIndex + 1} of ${exam.questions.length}</span>

        <div class="exam-stem">${q.stem}</div>

        <div class="choices-list">
          ${q.choices.map((c, i) => {
            const letter = String.fromCharCode(65 + i);
            const isSelected = selectedChoice === i;
            return `
              <button type="button" class="choice-item ${isSelected ? 'selected' : ''}" onclick="selectExamAnswer('${q.id}', ${i})">
                <div class="choice-letter">${letter}</div>
                <div class="choice-text">${c}</div>
              </button>
            `;
          }).join("")}
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:18px;">
          <button type="button" class="btn btn-outline" ${appState.currentQuestionIndex === 0 ? 'disabled style="opacity:0.4; cursor:not-allowed;"' : ''} onclick="navigateExamQuestion(-1)">
            ← Previous Question
          </button>
          
          ${appState.currentQuestionIndex < exam.questions.length - 1 ? `
            <button type="button" class="btn btn-primary" onclick="navigateExamQuestion(1)">
              Next Question →
            </button>
          ` : `
            <button type="button" class="btn btn-gold" onclick="finishExamSession()">
              Submit & View Results
            </button>
          `}
        </div>
      </div>

      <!-- Right: Palette & Timer -->
      <div class="exam-sidebar-nav">
        <div class="exam-timer-box">

          <div class="timer-display ${isUrgent ? 'urgent' : ''}">${timeFormatted}</div>
        </div>

        <div>
          <h4 style="font-size:13px; font-weight:700; margin-bottom:10px;">Question Navigator</h4>
          <div class="question-palette">
            ${exam.questions.map((item, idx) => {

              return `
                <button type="button" class="palette-node ${isCurrent ? 'current' : ''} ${isAnswered ? 'answered' : ''}" onclick="jumpToExamQuestion(${idx})">

      </div>
    </div>
  `;

function renderExamReview() {
  const exam = appState.activeExam;
  let correctCount = 0;
  exam.questions.forEach(q => {
    if (appState.userExamAnswers[q.id] === q.answer) correctCount++;
  });

  const percentage = Math.round((correctCount / exam.questions.length) * 100);
  const passed = percentage >= 60;

  return `
    <header class="top-header">
      <div>
        <span class="badge-pill" style="margin-left:0; background:${passed ? 'var(--primary)' : 'var(--danger)'}; color:white;">
          ${passed ? 'PASSED · ብቁ' : 'NEEDS REVISION'}
        </span>
        <h2 style="font-size:26px; margin-top:6px;">Examination Result: ${correctCount} of ${exam.questions.length} Correct (${percentage}%)</h2>
        <p style="color:var(--text-secondary); font-size:14px;">Results have been compiled into your progress record.</p>
      </div>

      <div class="top-actions">
        <button type="button" class="btn btn-outline" onclick="exitExamReview()">Return to Exams</button>
        <button type="button" class="btn btn-primary" onclick="setView('dashboard')">View on Dashboard</button>
      </div>
    </header>

    <div style="display:flex; flex-direction:column; gap:16px;">
      ${exam.questions.map((q, idx) => {
        const userAnswer = appState.userExamAnswers[q.id];
        const isCorrect = userAnswer === q.answer;
        return `
          <div class="card" style="border-left:4px solid ${isCorrect ? 'var(--primary)' : 'var(--danger)'};">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <span style="font-size:12.5px; font-weight:700; color:var(--text-secondary);">${q.subject} • ${q.topic}</span>
              <span class="badge-pill" style="background:${isCorrect ? 'var(--primary-dim)' : 'var(--danger-dim)'}; color:${isCorrect ? 'var(--primary)' : 'var(--danger)'};">
                ${isCorrect ? '✓ Correct' : '✕ Incorrect'}
              </span>
            </div>

            <h4 style="font-size:16px; font-weight:700; margin-bottom:14px;">${idx + 1}. ${q.stem}</h4>

            <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:14px;">
              ${q.choices.map((c, ci) => {
                const isSelected = userAnswer === ci;
                const isTheRightAnswer = q.answer === ci;
                let bg = "var(--bg-surface-elevated)";
                let border = "var(--border)";
                let badge = "";

                if (isTheRightAnswer) {
                  bg = "var(--primary-dim)";
                  border = "var(--primary)";
                  badge = "✓ Correct Answer";
                } else if (isSelected) {
                  bg = "var(--danger-dim)";
                  border = "var(--danger)";
                  badge = "✕ Your Selection";
                }

                return `
                  <div style="padding:10px 14px; border-radius:var(--radius-sm); background:${bg}; border:1px solid ${border}; display:flex; justify-content:space-between; align-items:center; font-size:13.5px;">
                    <span><strong>${String.fromCharCode(65 + ci)}.</strong> ${c}</span>
                    <span style="font-size:11px; font-weight:700;">${badge}</span>
                  </div>
                `;
              }).join("")}
            </div>

            <div style="padding:12px 14px; background:rgba(0,0,0,0.25); border-radius:var(--radius-sm); font-size:13px; color:var(--text-secondary);">
              <strong style="color:var(--gold);">Explanation & Solution: </strong>
              ${q.explanation}
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

/* =====================================================================
   MAIN RENDER DISPATCHER
===================================================================== */
function render() {
  const container = document.getElementById("appMain");
  if (!container) return;

  switch (appState.currentView) {
    case "dashboard":
      container.innerHTML = renderDashboard();
      break;
    case "library":
      container.innerHTML = renderLibrary();
      break;
    case "video":
      container.innerHTML = renderVideo();
      break;
    case "assistant":
      container.innerHTML = renderAssistant();
      scrollToChatBottom();
      break;
    case "exam":
      container.innerHTML = renderExam();
      break;
    case "dictionary":
      container.innerHTML = renderDictionary();
      break;
    default:
      container.innerHTML = renderDashboard();
  }
}

===================================================================== */

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function openBookReader(bookId) {
  const book = DIGITAL_BOOKS.find(b => b.id === bookId);
  if (!book) return;

  const modal = document.getElementById("modalContainer");
  modal.innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">

        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:16px;">
          <div>
            <span class="badge-pill" style="margin-left:0;">${book.badge}</span>
            <h2 style="font-size:22px; font-weight:800; margin-top:4px;">${book.title}</h2>
            <div style="color:var(--gold); font-family:'Noto Sans Ethiopic', Nyala, sans-serif;">${book.amharic}</div>
          </div>

        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn btn-outline" onclick="closeModal(null)">Dismiss</button>

        </div>
      </div>
    </div>
  `;

function closeModal(e) {
  if (e && e.target && !e.target.classList.contains("modal-overlay")) return;
  document.getElementById("modalContainer").innerHTML = "";
}

function downloadBookSummary(bookId) {
  const book = DIGITAL_BOOKS.find(b => b.id === bookId);
  if (!book) return;

  const content = `=====================================================
MELA (መላ) - ETHIOPIAN GRADE 12 CURRICULUM NOTES
=====================================================
Title: ${book.title}
Amharic: ${book.amharic}
Subject: ${book.subject}
Stream: ${book.stream}
Publisher / Author: ${book.author}
-----------------------------------------------------
SYLLABUS UNITS:
${book.units.map((u, i) => `${i + 1}. ${u}`).join("\n")}

SUMMARY:
${book.summary}

Prepared for Ethiopian University Entrance Examination (EUEE).
https://mela.edu.et
=====================================================`;

  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `MELA-Grade12-${book.id}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleUserChatSubmit(e) {
  e.preventDefault();
  const input = document.getElementById("aiChatInput");
  const text = input.value.trim();
  if (!text) return;

  appState.chatMessages.push({ sender: "user", text, time: "Just now" });
  input.value = "";
  render();

  setTimeout(() => {
    generateAiResponse(text);
  }, 600);
}

function sendAiPrompt(promptText) {
  appState.chatMessages.push({ sender: "user", text: promptText, time: "Just now" });
  setView("assistant");
  setTimeout(() => {
    generateAiResponse(promptText);
  }, 600);
}

function clearAiChat() {
  appState.chatMessages = [
    {
      sender: "bot",
      text: "Chat cleared! How can I assist your Grade 12 exam revision right now?",
      time: "Just now"
    }
  ];
  render();
}

function generateAiResponse(userQuery) {
  const q = userQuery.toLowerCase();
  let botHtml = "";

  if (q.includes("quadratic") || q.includes("x²") || q.includes("እኩልታ")) {
    botHtml = `
      <p>Here is the step-by-step resolution for a quadratic equation <strong>ax² + bx + c = 0</strong>:</p>
      <div class="step-box">
        <h5>ደረጃ 1: Discriminant ማስላት (D = b² - 4ac)</h5>
        <p>For x² - 5x + 6 = 0: a = 1, b = -5, c = 6.<br>D = (-5)² - 4(1)(6) = 25 - 24 = <strong>1</strong>.</p>
      </div>
      <div class="step-box">
        <h5>ደረጃ 2: ኳድራቲክ ፎርሙላን መጠቀም</h5>
        <p>x = (-b ± √D) / 2a = (5 ± √1) / 2 = (5 ± 1) / 2.</p>
      </div>
      <div class="step-box">
        <h5>ደረጃ 3: የመጨረሻ መልስ (Roots)</h5>
        <p>x₁ = (5 + 1)/2 = <strong>3</strong><br>x₂ = (5 - 1)/2 = <strong>2</strong>.<br>The real roots are <strong>x = 2 or x = 3</strong>.</p>
      </div>
      <p style="color:var(--gold); font-size:12.5px;">💡 EUEE Tip: Always test if the roots multiply to 'c/a' (2*3=6) and add to '-b/a' (2+3=5).</p>
    `;
  } else if (q.includes("newton") || q.includes("ኒውተን") || q.includes("force")) {
    botHtml = `
      <p><strong>የኒውተን ሁለተኛ የእንቅስቃሴ ሕግ (Newton's Second Law of Motion):</strong></p>
      <div class="step-box">
        <h5>መሰረታዊ ቀመር (Formula)</h5>
        <p><strong>ΣF = m · a</strong><br>(Net Force = Mass × Acceleration)</p>
      </div>
      <div class="step-box">
        <h5>ትርጓሜ በአማርኛ</h5>
        <p>በአንድ አካል ላይ የሚያርፈው ጥምር ኃይል (Net Force) የአካሉን ፍጥነት ይቀይራል (ያፈጥነዋል)። ኃይሉ ሲጨምር ፍጥንጥነቱ ይጨምራል፤ ክብደቱ (Mass) ሲጨምር ግን ፍጥንጥነቱ ይቀንሳል።</p>
      </div>
      <div class="step-box">
        <h5>የፈተና ምሳሌ (EUEE Exam Example)</h5>
        <p>A 5 kg block accelerates at 2 m/s².<br>Net force F = 5 kg × 2 m/s² = <strong>10 Newtons</strong>.</p>
      </div>
    `;
  } else if (q.includes("ph") || q.includes("acid") || q.includes("hcl") || q.includes("አሲድ")) {
    botHtml = `
      <p><strong>Calculating pH for a Strong Monoprotic Acid (HCl):</strong></p>
      <div class="step-box">
        <h5>ደረጃ 1: የሀይድሮጂን አዮን መጠን (H⁺ concentration)</h5>
        <p>Since HCl is a strong acid, it dissociates completely: HCl → H⁺ + Cl⁻.<br>Therefore, [H⁺] = 0.001 M = 10⁻³ M.</p>
      </div>
      <div class="step-box">
        <h5>ደረጃ 2: የፒኤች ቀመር (pH formula)</h5>
        <p>pH = -log₁₀[H⁺] = -log₁₀(10⁻³) = <strong>3.0</strong>.</p>
      </div>
      <p style="color:var(--primary); font-size:13px;">Since pH &lt; 7 at 25°C, the solution is strongly acidic!</p>
    `;
  } else if (q.includes("adwa") || q.includes("አድዋ") || q.includes("history") || q.includes("1896")) {
    botHtml = `
      <p><strong>The Battle of Adwa (የአድዋ ጦርነት - March 1, 1896):</strong></p>
      <p>Adwa is one of the most prominent topics in Ethiopian Grade 12 History. Key national exam facts to remember:</p>
      <div class="step-box">
        <h5>1. ምክንያት (Root Cause)</h5>
        <p>The deceptive Article XVII of the Treaty of Wuchale (1889), where the Italian version falsely claimed Ethiopia was an Italian protectorate.</p>
      </div>
      <div class="step-box">
        <h5>2. መሪዎች (Key Leaders)</h5>
        <p>Emperor Menelik II, Empress Taytu Betul, Ras Makonnen, Fitawrari Gebeyehu, and unified forces from all Ethiopian regions.</p>
      </div>
      <div class="step-box">
        <h5>3. ውጤት (Significance)</h5>
        <p>Total defeat of General Baratieri's Italian invading army; forced Italy to sign the Treaty of Addis Ababa (Oct 1896) recognizing unconditional Ethiopian sovereignty.</p>
      </div>
    `;
  } else {
    botHtml = `
      <p>I have processed your query: <em>"${escapeHtml(userQuery)}"</em>.</p>
      <div class="step-box">
        <h5>Curriculum Analysis</h5>
        <p>Based on the Ethiopian Grade 12 National Blueprint, ensure you review both theoretical definitions and mathematical problem applications for this unit.</p>
      </div>
      <p style="color:var(--gold); font-size:13px;">Would you like me to generate 3 mock exam questions with choices on this topic?</p>
    `;
  }

  appState.chatMessages.push({ sender: "bot", html: botHtml, time: "Just now" });
  render();
  scrollToChatBottom();
}

function scrollToChatBottom() {
  setTimeout(() => {
    const box = document.getElementById("chatMessagesBox");
    if (box) box.scrollTop = box.scrollHeight;
  }, 50);
}

function askAiToDeepenWord(word) {
  setView("assistant");
  sendAiPrompt(`Give me 3 realistic Ethiopian Grade 12 National Examination multiple-choice questions testing the academic term "${word}".`);
}

function speakWord(word) {
  if ('speechSynthesis' in window) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  } else {
    alert(`Pronunciation audio: /${word}/`);
  }
}

/* Exam Session Control */
function launchExamSession(packageId) {
  const pkg = EXAM_PACKAGES.find(p => p.id === packageId) || EXAM_PACKAGES[0];
  appState.activeExam = JSON.parse(JSON.stringify(pkg));
  appState.currentQuestionIndex = 0;
  appState.userExamAnswers = {};
  appState.examSecondsRemaining = pkg.durationMinutes * 60;
  appState.examFinished = false;

  if (appState.examTimerInterval) clearInterval(appState.examTimerInterval);
  appState.examTimerInterval = setInterval(() => {
    if (appState.examSecondsRemaining > 0 && !appState.examFinished) {
      appState.examSecondsRemaining--;
      renderActiveTimerOnly();
    } else if (appState.examSecondsRemaining <= 0 && !appState.examFinished) {
      finishExamSession();
    }
  }, 1000);

  setView("exam");
}

function renderActiveTimerOnly() {
  const timerEl = document.querySelector(".timer-display");
  if (!timerEl) return;
  const m = Math.floor(appState.examSecondsRemaining / 60);
  const s = appState.examSecondsRemaining % 60;
  timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  if (appState.examSecondsRemaining < 120) timerEl.classList.add("urgent");
}

function selectExamAnswer(qId, choiceIndex) {
  appState.userExamAnswers[qId] = choiceIndex;
  render();
}

function navigateExamQuestion(delta) {
  const newIndex = appState.currentQuestionIndex + delta;
  if (newIndex >= 0 && newIndex < appState.activeExam.questions.length) {
    appState.currentQuestionIndex = newIndex;
    render();
  }
}

function jumpToExamQuestion(index) {
  appState.currentQuestionIndex = index;
  render();
}

function confirmSubmitExam() {
  if (confirm("Are you sure you want to end and submit your examination?")) {
    finishExamSession();
  }
}

function finishExamSession() {
  if (appState.examTimerInterval) clearInterval(appState.examTimerInterval);
  appState.examFinished = true;
  render();
}

function exitExamReview() {
  appState.activeExam = null;
  appState.examFinished = false;
  render();
}

function startQuickCheckpoint() {
  launchExamSession(appState.activeStream === "natural" ? "euee-2016-nat" : "euee-2015-soc");
}

function openWeakTopicRescue() {
  launchExamSession(appState.activeStream === "natural" ? "euee-2016-nat" : "euee-2015-soc");
}

/* Event Delegation for Navigation */
document.querySelectorAll(".nav-item").forEach(btn => {
  btn.addEventListener("click", () => {
    setView(btn.dataset.view);
  });
});

// Initialize on page load
render();
</script>
